<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="forest-gold-stem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efffba" />
      <stop offset=".4" stop-color="#a8d070" />
      <stop offset=".8" stop-color="#4a8048" />
      <stop offset="1" stop-color="#245133" />
    </linearGradient>
    <radialGradient id="forest-dew-glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#efffba" stop-opacity=".9" />
      <stop offset="60%" stop-color="#80d880" stop-opacity=".5" />
      <stop offset="100%" stop-color="#2a6035" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g stroke="url(#forest-gold-stem)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main curving ancient vine -->
    <path d="M4 68 C6 38 18 18 48 10 C58 7 66 5 70 4" stroke-width="2.2" />
    <!-- Secondary leaf shoot -->
    <path d="M12 68 C15 45 28 26 56 22" stroke-width="1.4" opacity=".8" />
    <!-- Sprouting fern fronds and leaf tendrils -->
    <path d="M22 34 C16 28 14 18 24 16 C30 24 28 32 22 34 Z" fill="#6ba660" fill-opacity=".35" stroke-width="1.2" />
    <path d="M38 20 C36 10 44 4 50 10 C48 18 42 20 38 20 Z" fill="#88c878" fill-opacity=".4" stroke-width="1.2" />
    <path d="M14 52 C6 48 6 38 14 38 C20 44 18 50 14 52 Z" fill="#4e8848" fill-opacity=".35" stroke-width="1.1" />
    <path d="M48 12 C54 6 62 8 60 16 C54 18 48 16 48 12 Z" fill="#efffba" fill-opacity=".45" stroke-width="1.1" />
    <!-- Curling vine spiral -->
    <path d="M4 36 C8 32 14 34 12 40 C10 44 6 42 6 38" stroke-width="1.2" />
    <path d="M30 14 C34 10 40 12 38 16 C36 20 32 18 32 15" stroke-width="1.1" />
  </g>
  <!-- Glowing dewdrop / spore nodes -->
  <circle cx="24" cy="16" r="2.5" fill="url(#forest-dew-glow)" />
  <circle cx="50" cy="10" r="2.2" fill="url(#forest-dew-glow)" />
  <circle cx="14" cy="38" r="2" fill="url(#forest-dew-glow)" />
  <circle cx="68" cy="4" r="3" fill="#efffba" />
</svg>
