<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="forest-gold-stem-br" x1="1" y1="1" x2="0" y2="0">
      <stop stop-color="#efffba" />
      <stop offset=".4" stop-color="#a8d070" />
      <stop offset=".8" stop-color="#4a8048" />
      <stop offset="1" stop-color="#245133" />
    </linearGradient>
    <radialGradient id="forest-dew-glow-br" cx="50%" cy="50%" r="50%">
      <stop stop-color="#efffba" stop-opacity=".9" />
      <stop offset="60%" stop-color="#80d880" stop-opacity=".5" />
      <stop offset="100%" stop-color="#2a6035" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g stroke="url(#forest-gold-stem-br)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main curving ancient vine -->
    <path d="M68 4 C66 34 54 54 24 62 C14 65 6 67 2 68" stroke-width="2.2" />
    <!-- Secondary leaf shoot -->
    <path d="M60 4 C57 27 44 46 16 50" stroke-width="1.4" opacity=".8" />
    <!-- Sprouting fern fronds and leaf tendrils -->
    <path d="M50 38 C56 44 58 54 48 56 C42 48 44 40 50 38 Z" fill="#6ba660" fill-opacity=".35" stroke-width="1.2" />
    <path d="M34 52 C36 62 28 68 22 62 C24 54 30 52 34 52 Z" fill="#88c878" fill-opacity=".4" stroke-width="1.2" />
    <path d="M58 20 C66 24 66 34 58 34 C52 28 54 22 58 20 Z" fill="#4e8848" fill-opacity=".35" stroke-width="1.1" />
    <path d="M24 60 C18 66 10 64 12 56 C18 54 24 56 24 60 Z" fill="#efffba" fill-opacity=".45" stroke-width="1.1" />
    <!-- Curling vine spiral -->
    <path d="M68 36 C64 40 58 38 60 32 C62 28 66 30 66 34" stroke-width="1.2" />
    <path d="M42 58 C38 62 32 60 34 56 C36 52 40 54 40 57" stroke-width="1.1" />
  </g>
  <!-- Glowing dewdrop / spore nodes -->
  <circle cx="48" cy="56" r="2.5" fill="url(#forest-dew-glow-br)" />
  <circle cx="22" cy="62" r="2.2" fill="url(#forest-dew-glow-br)" />
  <circle cx="58" cy="34" r="2" fill="url(#forest-dew-glow-br)" />
  <circle cx="4" cy="68" r="3" fill="#efffba" />
</svg>
