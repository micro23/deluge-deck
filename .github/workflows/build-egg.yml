name: Build Deluge Egg

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (![version, `v${version}`].includes(process.env.RELEASE_TAG)) {
              throw new Error(`Release tag must be ${version} or v${version}`);
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Deluge and this plugin still use pkg_resources; newer setuptools may
      # remove it. Keep the legacy egg builder reproducible across the matrix.
      - run: python -m pip install -r plugin/build-requirements.txt
      - run: npm run build:plugin
        env:
          PYTHON: python
      - run: npm run verify:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DelugeDeck-egg-py${{ matrix.python }}
          path: |
            plugin/dist/*.egg
            plugin/dist/*.egg.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: DelugeDeck-egg-py*
          merge-multiple: true
          path: release-assets
      - name: Verify all release checksums
        working-directory: release-assets
        run: |
          eggs=(*.egg)
          checksums=(*.egg.sha256)
          test "${#eggs[@]}" -eq 4
          test "${#checksums[@]}" -eq 4
          sha256sum --check --strict *.egg.sha256
      - name: Attach eggs and checksums to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.egg release-assets/*.egg.sha256
