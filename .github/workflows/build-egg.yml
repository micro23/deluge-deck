name: Build Deluge Egg

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (![version, `v${version}`].includes(process.env.RELEASE_TAG)) {
              throw new Error(`Release tag must be ${version} or v${version}`);
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Deluge and this plugin still use pkg_resources; newer setuptools may
      # remove it. Keep the legacy egg builder reproducible for the source-only egg.
      - run: python -m pip install -r plugin/build-requirements.txt
      - run: npm run build:plugin
        env:
          PYTHON: python
      - run: npm run verify:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DelugeDeck-egg
          path: |
            plugin/dist/*.egg
            plugin/dist/*.egg.sha256
          if-no-files-found: error

  load-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: rm -rf plugin/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DelugeDeck-egg
          path: plugin/dist
      - name: Install isolated Deluge loader dependencies
        run: |
          python -m pip install -r plugin/build-requirements.txt
          python -m pip install --no-deps -r plugin/load-test-requirements.txt
          python -m pip install Twisted==25.5.0
      - run: python scripts/verify-plugin-load.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  publish:
    if: github.event_name == 'release'
    needs: [build, load-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DelugeDeck-egg
          path: release-assets
      - name: Verify the release checksum
        working-directory: release-assets
        run: |
          eggs=(*.egg)
          checksums=(*.egg.sha256)
          test "${#eggs[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          sha256sum --check --strict *.egg.sha256
      - name: Attach the egg and checksum to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.egg release-assets/*.egg.sha256
